name: Kamal deploy
description: Installs the repo's Ruby and Kamal with mise and runs `kamal deploy` over SSH, for the default branch's head only.

# The app's secrets reach Kamal (.kamal/secrets) as the job's env, which composite steps inherit:
#
#   env:
#     KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
#     DATABASE_URL: ${{ secrets.DATABASE_URL }}
#   steps:
#     - uses: actions/checkout@<sha>
#     - uses: ftes/ci/kamal-deploy@<sha>
#       with: {ssh-key: "${{ secrets.DEPLOY_SSH_KEY }}", known-hosts: config/known_hosts}

inputs:
  ssh-key:
    description: The deploy user's private SSH key
    required: true
  known-hosts:
    description: A known_hosts file in the repo; SSH, and with it Kamal, then accepts only those host keys. Empty trusts a host on first use.
    default: ""
  mise-version:
    description: The mise version to install
    default: "2026.8.14"

runs:
  using: composite
  steps:
    # Ruby, Kamal and KAMAL_HOST from the repo's mise.toml.
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: ${{ inputs.mise-version }}
        install_args: ruby gem:kamal

    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Kamal's net-ssh reads both files, so its connections are checked too.
        if [ -n "$KNOWN_HOSTS" ]; then
          cp "$KNOWN_HOSTS" ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        fi

    # A run whose commit the default branch has moved past skips the deploy: its CI can finish after
    # a newer one's, or be re-run, and would ship an older image. The newer commit deploys after its
    # own CI.
    - name: Check this is the default branch's head
      id: head
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
        if [ "$head" = "$GITHUB_SHA" ]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Not deploying $GITHUB_SHA: $BRANCH is at $head, which deploys after its own CI"
        fi

    - name: Deploy
      if: steps.head.outputs.current == 'true'
      shell: bash
      run: kamal deploy
