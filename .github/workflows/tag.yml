name: Tag

# Each push to main that changes more than docs becomes a release: the next patch tag, which
# Renovate turns into a PR in each repo that pins these actions. A docs-only push would give them a
# PR that changes nothing, so its docs ship with the next release; so would CodeRabbit's config.
# Pushes in quick succession can share one: a concurrency group keeps only the newest pending run,
# and the newest commit is the one to release. A minor or major release is a tag pushed by hand; the
# next push patches on from it. GITHUB_TOKEN can't create a ref on a commit that edits a workflow
# (403, it lacks `workflows`), so that push only warns: the next push the job can tag releases it,
# or tag it by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".coderabbit.yaml"]

concurrency:
  group: tag
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubicloud-standard-2-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tags=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[] | "\(.name) \(.commit.sha)"')
          if grep -q " $SHA$" <<< "$tags"; then echo "$SHA is already tagged"; exit 0; fi
          latest=$(cut -d' ' -f1 <<< "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$next" -f sha="$SHA" > /dev/null; then
            if gh api "repos/$GH_REPO/commits/$SHA" --jq '.files[].filename' | grep -q '^\.github/workflows/'; then
              echo "::warning::$SHA edits a workflow, which GITHUB_TOKEN can't tag: the next push the job can tag releases it, or tag $next by hand"
              exit 0
            fi
            exit 1
          fi
          echo "Tagged $SHA as $next"
