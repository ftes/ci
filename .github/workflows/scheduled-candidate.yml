name: Isolated scheduled candidate

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      base:
        required: true
        type: string
      checkout-sha:
        required: true
        type: string
      client-id:
        required: true
        type: string
      runner:
        required: true
        type: string
      key:
        required: true
        type: string
      targets:
        default: "[]"
        type: string
      review-pr:
        default: ""
        type: string
      prompt:
        required: true
        type: string
    outputs:
      redo:
        value: ${{ jobs.publish.outputs.redo }}

permissions: {}

env:
  MIX_ENV: test

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      has-patch: ${{ steps.plan.outputs.has-patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-sha }}
          persist-credentials: false
      - id: threads
        if: inputs.review-pr != ''
        continue-on-error: true
        uses: ftes/ci/review-threads@1ba850d30f0ed2c8e2b8a1980437b4d80f6689c2
        with:
          prs: ${{ inputs.review-pr }}
          authors: claude opencode-agent coderabbitai
          recover: false
      - id: plan
        uses: ftes/ci/opencode-scheduled@1ba850d30f0ed2c8e2b8a1980437b4d80f6689c2
        with:
          phase: plan
          mode: ${{ inputs.mode }}
          client-id: ${{ inputs.client-id }}
          base: ${{ inputs.base }}
          base-sha: ${{ inputs.checkout-sha }}
          targets: ${{ inputs.targets }}
          schema: ${{ steps.threads.outcome == 'success' && steps.threads.outputs.schema || '' }}
          candidate-dir: ${{ runner.temp }}/scheduled-candidate
          prompt: ${{ inputs.prompt }}
      - id: upload
        if: steps.plan.outputs.candidate == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-${{ inputs.mode }}-${{ inputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduled-candidate/
          if-no-files-found: error
          retention-days: 7

  check:
    needs: plan
    if: needs.plan.outputs.has-patch == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: ${{ github.repository == 'ftes/fluffy' && inputs.mode == 'fix' && 'postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/scheduled-candidate
          merge-multiple: true
      - uses: ftes/ci/opencode-scheduled@1ba850d30f0ed2c8e2b8a1980437b4d80f6689c2
        with:
          phase: check
          mode: ${{ inputs.mode }}
          client-id: ${{ inputs.client-id }}
          base: ${{ inputs.base }}
          base-sha: ${{ inputs.checkout-sha }}
          targets: ${{ inputs.targets }}
          candidate-dir: ${{ runner.temp }}/scheduled-candidate
      - uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - if: github.repository == 'ftes/fluffy' && inputs.mode == 'fix'
        uses: ftes/ci/playwright-browser@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Check the exact candidate patch
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          case "$GITHUB_REPOSITORY" in
            ftes/playwright_ex)
              mix credo
              mix playwright.parity
              ;;
            ftes/phoenix_test_playwright)
              mix credo
              ;;
            ftes/spraywall)
              mix credo --strict --format oneline
              mix gettext.extract --check-up-to-date
              ;;
            ftes/fluffy)
              mix credo --format oneline
              if [[ $MODE == fix ]]; then
                mix assets.build
                mix fluffy.playwright_source
                mix test
              fi
              ;;
            *)
              echo "::error::No scheduled checks for $GITHUB_REPOSITORY."
              exit 1
              ;;
          esac

  publish:
    needs: [plan, check]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.artifact != '' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.plan.outputs.has-patch == 'false'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    outputs:
      redo: ${{ steps.publish.outputs.redo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-sha }}
          persist-credentials: false
      # Only the same-run immutable artifact chosen by plan is accepted.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/scheduled-candidate
          merge-multiple: true
      - id: threads
        if: inputs.review-pr != ''
        continue-on-error: true
        uses: ftes/ci/review-threads@1ba850d30f0ed2c8e2b8a1980437b4d80f6689c2
        with:
          prs: ${{ inputs.review-pr }}
          authors: claude opencode-agent coderabbitai
          require-snapshot: true
      - id: publish
        uses: ftes/ci/opencode-scheduled@1ba850d30f0ed2c8e2b8a1980437b4d80f6689c2
        with:
          phase: publish
          mode: ${{ inputs.mode }}
          client-id: ${{ inputs.client-id }}
          base: ${{ inputs.base }}
          base-sha: ${{ inputs.checkout-sha }}
          targets: ${{ inputs.targets }}
          schema: ${{ steps.threads.outcome == 'success' && steps.threads.outputs.schema || '' }}
          candidate-dir: ${{ runner.temp }}/scheduled-candidate
