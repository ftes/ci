name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.8.14"
      # actionlint checks the workflows; zizmor the workflows and actions, for security.
      - run: actionlint
      - run: zizmor --persona=regular --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
