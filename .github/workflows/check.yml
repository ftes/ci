name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    runs-on: ubicloud-standard-2-ubuntu-2604
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
      # actionlint checks the workflows; zizmor the workflows and actions, for security.
      - run: actionlint
      - run: zizmor --persona=regular --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
      # The actions' scripts; actionlint checks only the workflows' run blocks.
      - run: shellcheck claude-review/*.sh

  # `setup` on the fixture project. Erlang must come precompiled: a cold install from source takes
  # ~5 min per job. The reinstall forbids compiling, so it fails if setup's precompiled OS is
  # missing or has no build, even when mise's cache restored Erlang. Then setup must fail when
  # deps.get changes mix.lock, and pass on a lock it leaves as is.
  setup:
    runs-on: ubicloud-standard-2-ubuntu-2604
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup works on the repo root, so the fixture becomes it.
      - run: cp -R test/fixture/. .
      - uses: ./setup # zizmor: ignore[self-repository]
        id: setup
      - name: Reinstall Erlang, precompiled only
        env:
          MISE_ERLANG_COMPILE: "false"
          ERLANG: ${{ steps.setup.outputs.erlang }}
          ERLANG_BUILD: ${{ steps.setup.outputs.erlang-build }}
        run: |
          echo "MISE_ERLANG_PRECOMPILED_OS=$MISE_ERLANG_PRECOMPILED_OS erlang-build=$ERLANG_BUILD"
          [[ $ERLANG_BUILD =~ ^[0-9a-f]{12}$ ]]
          time mise install --force "erlang@$ERLANG"

      # A dep the (empty) lock written below lacks: deps.get adds it, so the lock check fails.
      - name: Make mix.lock stale
        run: |
          sed -i 's/deps: \[\]/deps: [{:jason, "~> 1.4"}]/' mix.exs
          echo '%{}' > mix.lock
      - uses: ./setup # zizmor: ignore[self-repository]
        id: stale
        continue-on-error: true
      # Failed at the check: deps.get ran and locked the dep, deps.compile never ran.
      - name: Expect the stale lock to fail setup
        env:
          OUTCOME: ${{ steps.stale.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q '"jason"' mix.lock
          test ! -d _build/test/lib/jason
      # The lock deps.get just wrote is current, so setup passes and compiles the dep.
      - uses: ./setup # zizmor: ignore[self-repository]
      - run: test -d _build/test/lib/jason

  # The release script (release/): formatted, and it compiles (with no arguments it raises its
  # usage). On the fixture project's toolchain, set up as in the setup job.
  release:
    runs-on: ubicloud-standard-2-ubuntu-2604
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp -R test/fixture/. .
      - uses: ./setup # zizmor: ignore[self-repository]
      - run: mix format --check-formatted
      - run: |
          release/release.exs 2>&1 | grep 'usage: release/release.exs'

  # The check the `main` ruleset requires, as in ftes's other repos: passes once every job passed.
  quality:
    name: quality
    if: always()
    needs: [lint, setup, release]
    runs-on: ubicloud-standard-2-ubuntu-2604
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with: $result"
              exit 1
            fi
          done
