# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's PR review for ftes's public repos (the others point here with remote_config):
# findings, not summaries.
tone_instructions: Be concise. Report defects with a concrete failure scenario; label anything else a nitpick. Skip praise and restating the diff.
reviews:
  profile: chill
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # PR title and description checks: notes on the PR, not on the code.
  pre_merge_checks:
    title: {mode: "off"}
    description: {mode: "off"}
    issue_assessment: {mode: "off"}
  auto_review:
    # Drafts wait until ready; any base branch, so a PR stacked on another gets reviewed.
    drafts: false
    base_branches: [".*"]
    # Renovate's PRs are tested by CI and merge on their own.
    ignore_usernames: ["renovate[bot]"]
  # Requests changes for blocking findings and approves once its threads are resolved and the
  # latest commit is reviewed: with a ruleset requiring one approval, that gates the merge (a
  # declined finding: resolve it, or `@coderabbitai approve`).
  auto_approvals:
    enabled: true
    # A skipped review (Renovate's PRs, a draft, a file limit) still approves, so automerge works.
    approve_on_skipped_review: true
  # A review that stops on an error fails the `CodeRabbit` check instead of passing silently.
  fail_commit_status: true
