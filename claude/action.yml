# The caller's job checks out the code Claude works on (`persist-credentials: false`), runs any setup
# (ftes/ci/setup), and has `id-token: write`: claude-code-action exchanges the job's OIDC token for
# the Claude GitHub App's. That exchange checks the calling workflow file against the default
# branch's, which a composite action leaves alone (a reusable workflow would not). Pinned by SHA, a
# branch can't change this action; a prompt-file is read from the default branch for the same
# reason.
#
#   permissions: {contents: read, pull-requests: read, issues: read, id-token: write}
#   steps:
#     - uses: actions/checkout@<sha>
#       with: {persist-credentials: false, fetch-depth: 0}
#     - uses: ftes/ci/claude@<sha>
#       with:
#         token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         allowed-tools: "Read,Grep,Glob,Bash(git diff:*)"
#
# The tool rules (allowed-tools, the denials below, dontAsk) steer Claude's tool use; they are no
# sandbox: a job that lets Claude edit files and run mix lets it run code. What such a job relies on
# is that it loads no other repository's content, the tokens' scopes, and the rulesets.
name: Claude
description: Runs claude-code-action with the shared model, tool rules and no attribution, then writes its result to the step summary.

inputs:
  token:
    description: The CLAUDE_CODE_OAUTH_TOKEN secret (a composite action can't read secrets)
    required: true
  prompt:
    description: "The prompt, or with prompt-file the lines above it (`PR: 12`). Neither: tag mode, Claude follows the comment that tagged it."
    default: ""
  prompt-file:
    description: A prompt in the caller's repository (`.github/prompts/fix-ci.md`), read from its default branch, after `prompt`
    default: ""
  system-prompt:
    description: Appended to the system prompt, before the tool rules. Plain text, no double quotes.
    default: ""
  max-turns:
    description: Claude's --max-turns
    default: "100"
  allowed-tools:
    description: Claude's --allowedTools, comma-separated
    required: true
  disallowed-tools:
    description: Claude's --disallowedTools, comma-separated, besides the ones every job denies (Run Claude)
    default: ""
  add-dir:
    description: Directories Claude may read besides the checkout, space-separated
    default: ""
  allowed-bots:
    description: claude-code-action's allowed_bots
    default: ""
  comment-authors:
    description: "claude-code-action's include_comments_by_actor: the logins whose comments, reviews and review comments tag mode shows Claude (ftes/ci/claude-tag lists maintainers'). Empty: every login."
    default: ""
  additional-permissions:
    description: claude-code-action's additional_permissions
    default: ""
  json-schema:
    description: "Claude's --json-schema, on one line without single quotes: Claude then returns its answer as `structured_output`"
    default: ""
  model:
    description: Claude's --model
    default: claude-opus-5-5

outputs:
  execution_file:
    description: claude-code-action's execution file (the transcript)
    value: ${{ steps.claude.outputs.execution_file }}
  structured_output:
    description: "Claude's answer as a JSON string, with json-schema: data, to pass to a script by env"
    value: ${{ steps.claude.outputs.structured_output }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
        JSON_SCHEMA: ${{ inputs.json-schema }}
        MAX_TURNS: ${{ inputs.max-turns }}
        MODEL: ${{ inputs.model }}
        system_prompt: ${{ inputs.system-prompt }}
        allowed_tools: ${{ inputs.allowed-tools }}
        disallowed_tools: ${{ inputs.disallowed-tools }}
        add_dir: ${{ inputs.add-dir }}
      run: |
        if [[ -n $PROMPT_FILE && ( ! $PROMPT_FILE =~ ^[A-Za-z0-9._/-]+$ || $PROMPT_FILE == *..* ) ]]; then
          echo "::error::prompt-file: a path in the repository, got: $PROMPT_FILE"; exit 1
        fi
        if [[ $JSON_SCHEMA == *"'"* || $JSON_SCHEMA == *$'\n'* ]]; then echo "::error::json-schema: one line without single quotes"; exit 1; fi
        if [[ ! $MAX_TURNS =~ ^[0-9]+$ ]]; then echo "::error::max-turns: a number, got: $MAX_TURNS"; exit 1; fi
        if [[ ! $MODEL =~ ^[a-z0-9.-]+$ ]]; then echo "::error::model: a model id, got: $MODEL"; exit 1; fi
        # They sit in quoted claude_args arguments.
        for name in system-prompt allowed-tools disallowed-tools add-dir; do
          var=${name//-/_}; value=${!var}
          if [[ $value == *'"'* || $value == *$'\n'* ]]; then echo "::error::$name: one line without double quotes"; exit 1; fi
        done

    # From the default branch, not the checkout: a branch's change to a prompt takes effect once it
    # is merged.
    - name: Read the prompt
      id: prompt
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROMPT: ${{ inputs.prompt }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: |
        eof="EOF_$(openssl rand -hex 16)"
        if [[ -n $PROMPT_FILE ]]; then
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          file=$(gh api "repos/$GITHUB_REPOSITORY/contents/$PROMPT_FILE?ref=$branch" -H "Accept: application/vnd.github.raw")
          if [[ -n $PROMPT ]]; then PROMPT=$(printf '%s\n\n%s' "$PROMPT" "$file"); else PROMPT=$file; fi
        fi
        printf 'prompt<<%s\n%s\n%s\n' "$eof" "$PROMPT" "$eof" >> "$GITHUB_OUTPUT"

    # The tool rules steer Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist.
    - name: Run Claude
      id: claude
      uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
      env:
        # Runs subagents in the foreground. A headless run ends with Claude's turn, which drops any
        # still running in the background: they never report back.
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.token }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        allowed_bots: ${{ inputs.allowed-bots }}
        include_comments_by_actor: ${{ inputs.comment-authors }}
        additional_permissions: ${{ inputs.additional-permissions }}
        # The owner forbids attribution. dontAsk: a call that no rule allows is denied, except the
        # read-only ones Claude Code always allows (the action would otherwise start in auto mode,
        # where a review decides them). Tag mode runs in acceptEdits instead, which also allows file
        # edits in the checkout.
        settings: |
          {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}, "permissions": {"defaultMode": "dontAsk"}}
        # --disallowedTools: the caller's, and in every job other repositories' PRs and issues, the
        # comments and reviews (which anyone can write; ftes/ci/claude-tag and claude-review give
        # Claude maintainers' instead), API paths outside the allowed ones, and mix's commands that
        # run arbitrary code.
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          ${{ inputs.add-dir != '' && format('--add-dir {0}', inputs.add-dir) || '' }}
          --append-system-prompt "${{ inputs.system-prompt }} Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, git -C, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules. No Claude attribution: leave the Generated with Claude Code signature out of commits, PRs and comments."
          --allowedTools "${{ inputs.allowed-tools }}"
          --disallowedTools "Bash(gh pr * -R*),Bash(gh pr * --repo*),Bash(gh issue * -R*),Bash(gh issue * --repo*),Bash(gh pr view *comments*),Bash(gh pr view *eview*),Bash(gh pr view * -c*),Bash(gh issue view *comments*),Bash(gh issue view * -c*),Bash(gh api *comments*),Bash(gh api *reviews*),Bash(gh api *timeline*),Bash(gh api graphql*),Bash(gh api *..*),Bash(gh api *%*),Bash(gh api * --hostname*),Bash(mix cmd*),Bash(*mix cmd*),Bash(*mix run*),Bash(*mix eval*)${{ inputs.disallowed-tools != '' && format(',{0}', inputs.disallowed-tools) || '' }}"
          ${{ inputs.json-schema != '' && format('--json-schema ''{0}''', inputs.json-schema) || '' }}

    # summary.jq: only the final message and the denied calls, as the transcript can hold secrets.
    - name: Summarize Claude's result
      if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: jq -r -f "$GITHUB_ACTION_PATH/summary.jq" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
